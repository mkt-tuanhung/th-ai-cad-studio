# Builds the Windows installer (MD-CAD-AI-STUDIO-Setup-<ver>.exe) on a GitHub-hosted Windows runner.
# Free for public repositories; private repositories use the account's included Actions minutes.
# Run it from the Actions tab ("Run workflow") or by pushing a tag v*.
name: windows-installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  # fast feedback (~3 min): the engine core + unit tests with MSVC, no Qt / OCCT / llama.cpp
  core-msvc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build and test the core with MSVC
        shell: pwsh
        run: |
          choco install ninja -y --no-progress
          cmake -S native -B build-core -G Ninja -DCMAKE_BUILD_TYPE=Release -DTHCAD_WITH_QT=OFF -DTHCAD_WITH_OCCT=OFF -DTHCAD_WITH_LLAMA=OFF
          if ($LASTEXITCODE) { throw "configure" }
          cmake --build build-core
          if ($LASTEXITCODE) { throw "build" }
          ctest --test-dir build-core --output-on-failure
          if ($LASTEXITCODE) { throw "tests" }
      - name: Offline 3D library pack installer (merge keeps the user's items)
        shell: pwsh
        run: ./native/packaging/windows/library_pack/test_library_pack.ps1

  # CNC safety + CAM unit tests (pure TypeScript, Node): a failed assertion ({ all: false }) fails the job
  ui-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: CNC gate, panel CAM and part CAM unit tests
        working-directory: ui
        run: |
          npm ci
          UNIT=cnc node tools/test-cam.mjs run
          UNIT=cam node tools/test-cam.mjs run
          UNIT=partcam node tools/test-cam.mjs run

  build:
    runs-on: windows-2022
    timeout-minutes: 300
    env:
      # vcpkg binary cache: Open CASCADE takes ~1 h to build the first time, minutes afterwards
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # restore/save split: the caches are kept even when a later step fails (Open CASCADE takes ~1.5 h)
      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ hashFiles('native/packaging/windows/vcpkg.json') }}-${{ github.run_id }}
          # the cache holds packages by ABI hash: an older manifest's cache still serves Open CASCADE
          restore-keys: |
            vcpkg-${{ hashFiles('native/packaging/windows/vcpkg.json') }}-
            vcpkg-

      - name: Restore Qt cache
        id: qtcache
        uses: actions/cache/restore@v4
        with:
          path: C:\Qt
          key: qt-6.10.3-msvc2022_64-webengine

      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Tools (Ninja, Inno Setup)
        shell: pwsh
        run: |
          choco install ninja innosetup -y --no-progress
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -Append $env:GITHUB_PATH

      - name: Build, test and package
        timeout-minutes: 200
        shell: pwsh
        run: |
          # GitHub's Windows runners have no GPU: the offscreen-3D pixel checks are skipped there
          $env:THCAD_TEST_NO_GPU = "1"
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          New-Item -ItemType Directory -Force vcpkg-cache | Out-Null
          ./native/packaging/windows/build_windows.ps1 -QaBuild

      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ hashFiles('native/packaging/windows/vcpkg.json') }}-${{ github.run_id }}

      - name: Save Qt cache
        if: always() && steps.qtcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\Qt
          key: qt-6.10.3-msvc2022_64-webengine

      # the packaged app is licence-enforced (locked without a key for this PC, QA hooks off), so the self-test runs
      # the unlocked QA build of the same sources in a copy of the staged folder; the installer never contains it
      - name: In-app self-test (bridge, engine, BIM, OCCT; no AI model on the runner)
        shell: pwsh
        run: |
          Copy-Item -Recurse "native/dist-win/MD CAD AI STUDIO" "native/qa-stage"
          Copy-Item -Force "native/build-win-qa/app/MD CAD AI STUDIO.exe" "native/qa-stage/MD CAD AI STUDIO.exe"
          $exe = "native/qa-stage/MD CAD AI STUDIO.exe"
          $env:THCAD_SELFTEST = "1"; $env:THCAD_QUIT_AFTER_MS = "60000"; $env:QT_QUICK_BACKEND = "software"
          # a GUI-subsystem exe logs to OutputDebugString unless told otherwise
          $env:QT_FORCE_STDERR_LOGGING = "1"
          $log = & $exe 2>&1 | Out-String
          $log
          if ($log -notmatch "SELFTEST DONE OK") { throw "self-test failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: MD-CAD-AI-STUDIO-Windows
          path: native/dist-win/MD-CAD-AI-STUDIO-Setup-*.exe
          if-no-files-found: error
